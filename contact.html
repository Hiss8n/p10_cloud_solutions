<form id='f'>
  <input name='name' placeholder='Your name' required>
  <input name='email' type='email' placeholder='Email' required>
  <select name='language'><option>English</option><option>French</option><option>Portuguese</option></select>
  <button>Send</button>
</form>
<script>
    const Url='https://script.google.com/macros/s/AKfycbw6JNOB_nA4oJ4LnMpewBXywIAmoI7Zi347wFr3_-rRlbfGJajosaxzNmsL2Ws7G8Ub/exec'
document.getElementById('f').addEventListener('submit', function(e){
  e.preventDefault();
  fetch(Url, {method:'POST', mode:'no-cors', body:new URLSearchParams(new FormData(e.target))})
    .then(function(){ alert('Thanks! We will be in touch.'); e.target.reset(); });
});
</script>
